<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>สารบบคดีปกครอง</title>
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Sarabun,"Leelawadee UI",Tahoma,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#fb{position:fixed;right:8px;bottom:8px;z-index:9;font-size:12px;background:rgba(30,58,95,.85);color:#fff;padding:4px 10px;border-radius:12px;text-decoration:none;opacity:.55}
#fb:hover{opacity:1}
.msg{margin:40px 16px;text-align:center;color:#334}
</style></head><body>
<!-- หน้าคั่นกัน /u/1: เปิดเว็บแอป Apps Script ใน iframe แบบไม่ส่งคุกกี้ Google (credentialless)
     → Google ไม่แทรก /u/1 แม้เบราว์เซอร์ล็อกอินหลายบัญชี
     ใช้ได้ 2 แบบ:  ?x=<ลิงก์ .../exec?...>  หรือ  ?t=<โทเค็น>&... (เปิดเว็บแอปหลัก)
     รับเฉพาะลิงก์ script.google.com/macros/.../exec เท่านั้น (กันถูกใช้เป็นตัวเปลี่ยนเส้นทาง) -->
<script>
(function(){
  var MAIN='https://script.google.com/macros/s/AKfycbxicVYZH2fkm2VKS5kiNHXLm8Heoy5IhiO9tP9g9xF7AAm4M3PfUWApSK4HbwiaRGR2/exec';
  var RX=/^https:\/\/script\.google\.com\/macros\/(u\/\d+\/)?s\/[A-Za-z0-9_-]+\/exec(\?[^#\s]*)?$/;
  var q=new URLSearchParams(location.search), x=q.get('x');
  var src;
  if(x){
    if(!RX.test(x)){document.body.innerHTML='<p class="msg">ลิงก์ไม่ถูกต้อง</p>';return;}
    src=x.replace(/\/macros\/u\/\d+\//,'/macros/');
  } else src=MAIN+(location.search||'');
  var f=document.createElement('iframe');
  f.setAttribute('credentialless','');
  f.setAttribute('referrerpolicy','no-referrer');
  f.setAttribute('allow','clipboard-write; clipboard-read; geolocation');
  f.src=src;document.body.appendChild(f);
  var a=document.createElement('a');a.id='fb';a.href=src;a.target='_blank';a.rel='noreferrer noopener';
  a.textContent='เปิดหน้าต่างใหม่';document.body.appendChild(a);
})();
</script>
</body></html>
